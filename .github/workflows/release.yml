name: Application CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: main
    tags: ['*']

jobs:
  build:
    permissions:
      actions: write
      contents: write
      pages: write
      id-token: write
    uses: DreamWeave-MP/StroggForge/.github/workflows/rustGlobalBuild.yml@v52
    secrets: inherit
    with:
      binary_names: '["dream-ini"]'
      # Optional: set NEXUS_API_KEY and NEXUS_GROUP_IDS repository or organization secrets
      # to upload release archives to Nexus Mods. Use StroggForge's
      # .github/nexus_group_ids.template.json as the NEXUS_GROUP_IDS shape.
      enable_android: true
      enable_portmaster: true
      # The muOS app: each PortMaster archive, with these files beside the binary, is published
      # as dream-ini-Portmaster-ARM64.muxapp.
      muxapp_dir: "Dream INI"
      # StroggForge records each release in content/home/mod.lock and deploys the documentation
      # site in content/.
      mod_template: true
