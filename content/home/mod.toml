# dream-ini as a DreamWeave project: a Jess package. `jess` names the Package Source it
# publishes, the jess.toml at the repository root, and each release tag `dream_ini-<version>` is one
# version of the package, packed by the Mod Template from that tag; every push packs a
# development build.
id = "79c1c987-d68a-48a2-a3b9-5addce404eb9"
slug = "dream_ini"
type = "library"
status = "active"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[package]
format = "jpk"
jess = "org.dreamweave.dream-ini"

[[releases]]
version = "0.1.0"
date = 2026-10-21
summary = "First release published as a DreamWeave project."
