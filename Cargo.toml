[package]
name = "dream-ini"
version = "0.4.0"
edition = "2024"
description = "Import Morrowind.ini settings into OpenMW configuration files"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["openmw", "morrowind", "ini", "config"]
categories = ["command-line-utilities", "config"]

[dependencies]
clap_complete = "4"
clap_mangen = "0.3"
clap = { version = "4", features = ["derive"] }
dream-soft-render = { version = "1.0.0", features = ["egui"], optional = true }
encoding_rs = "0.8"
eframe = { version = "0.34", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = { version = "0.34", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
# The Luau binder behind the `luau` feature; a path dependency for the migration campaign.
l3i = { path = "../dream-binder", optional = true }
openmw-config = "2.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
gilrs = { version = "0.11", optional = true }

[features]
default = ["gui"]
controller-support = ["dep:gilrs", "dep:libc"]
gui = ["dep:eframe", "dep:egui", "dep:image", "controller-support"]
# The `dream.ini` Luau extension (`luau` module); `lua` is the former spelling.
luau = ["dep:l3i"]
lua = ["luau"]
# Test-only: proves the declared Luau types with Luau's own frontend (`tests/luau_typed.rs`).
# Cargo has no optional dev-dependencies, so plain `cargo test` skips the analysis build.
luau-analysis = ["luau", "l3i/analysis"]
portmaster-gui = ["dep:dream-soft-render", "dep:egui", "controller-support"]

[dev-dependencies]
criterion = "0.8"

[[test]]
name = "luau"
required-features = ["luau"]

[[test]]
name = "luau_typed"
required-features = ["luau-analysis"]

[[bench]]
name = "round_trip"
harness = false

[[bench]]
name = "luau_boundary"
harness = false
required-features = ["luau"]

# Thin LTO in every release build. Where .cargo/config.toml passes -Clinker-plugin-lto (Linux,
# Windows, PortMaster) lld runs it over the whole program's bitcode; on macOS and Android rustc
# runs it over the Rust crates.
[profile.release]
lto = "thin"
